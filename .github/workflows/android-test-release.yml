name: Android TEST Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - name: Verify master engineering standard
        run: python3 scripts/verify_governance.py
      - name: Build debug TEST APK
        run: gradle :app:assembleDebug
      - name: Write APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > LumaSift-Android-TEST-SHA256SUMS.txt
      - name: Publish TEST prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-v0.1.0-test
          name: LumaSift Android v0.1.0 TEST
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            LumaSift-Android-TEST-SHA256SUMS.txt
